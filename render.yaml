services:
  - type: web
    name: fbie-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FBIE_MODE
        value: demo
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
